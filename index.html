    <!-- JSON-LD: FAQPage for rich snippets – targeting top UK arthritis searches -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the best diet for osteoarthritis in the UK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Mediterranean diet is widely recommended for osteoarthritis. It emphasises anti-inflammatory foods like oily fish (salmon, mackerel, sardines), olive oil, nuts, berries and plenty of vegetables to help reduce joint pain and stiffness."
          }
        },
        {
          "@type": "Question",
          "name": "What exercises help with arthritis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Low-impact exercises such as walking, swimming, cycling and gentle stretching are recommended. Strengthening exercises for muscles around affected joints (e.g. leg raises, wall sits) also help improve mobility and reduce pain."
          }
        },
        {
          "@type": "Question",
          "name": "Can I get free virtual physiotherapy for arthritis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Living With Arthritis offers free virtual physiotherapy resources including guided joint exercises, myth-busting advice and an AI assistant to help you manage your symptoms from home."
          }
        },
        {
          "@type": "Question",
          "name": "How many people in the UK have arthritis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Around 10 million people in the UK live with arthritis, including osteoarthritis and rheumatoid arthritis. It affects people of all ages, though it is most common in those over 50."
          }
        },
        {
          "@type": "Question",
          "name": "What are the first signs of osteoarthritis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Early signs include joint pain during or after movement, morning stiffness lasting less than 30 minutes, tenderness when pressing on the joint, loss of flexibility, and a grating or crackling sensation (crepitus). The knees, hips and hands are most commonly affected."
          }
        },
        {
          "@type": "Question",
          "name": "Is arthritis a disability in the UK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Arthritis can be classed as a disability under the Equality Act 2010 if it has a substantial and long-term adverse effect on your ability to carry out normal daily activities. You may be eligible for Personal Independence Payment (PIP) or other benefits."
          }
        },
        {
          "@type": "Question",
          "name": "What is the best painkiller for arthritis UK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NICE guidelines recommend topical NSAIDs (anti-inflammatory gels) as first-line treatment for knee and hand osteoarthritis. Paracetamol, oral NSAIDs and capsaicin cream are also options. Always consult your GP or pharmacist for personalised advice."
          }
        },
        {
          "@type": "Question",
          "name": "Does turmeric help with arthritis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Research suggests curcumin (the active compound in turmeric) has anti-inflammatory properties. A 2016 systematic review supports around 1,000 mg/day of curcumin extract for arthritis symptom relief. Look for formulations with piperine (black pepper) for better absorption."
          }
        },
        {
          "@type": "Question",
          "name": "Can you get arthritis in your 20s or 30s?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. While osteoarthritis is more common after 50, rheumatoid arthritis often begins between ages 30 and 50. Younger people can also develop arthritis after joint injuries, due to genetic factors, or from autoimmune conditions."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get referred to a rheumatologist on the NHS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your GP can refer you to an NHS rheumatologist if they suspect inflammatory arthritis or if your symptoms are not responding to standard treatments. NICE recommends urgent referral if rheumatoid arthritis is suspected, ideally within 3 weeks."
          }
        }
      ]
    }
    </script>
