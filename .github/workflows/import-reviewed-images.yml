name: Import reviewed images once
on:
  push:
    branches: [blog-images-reviewed-24nov]
    paths: [.github/workflows/import-reviewed-images.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Louis-Maxwell/livingwitharthritis' && github.ref == 'refs/heads/blog-images-reviewed-24nov'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and extract exact reviewed patch
        shell: python
        run: |
          import subprocess, pathlib, base64, hashlib, gzip
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          parts = [p for p in files if p.endswith('.b64') and ('reviewed-import-part-' in p or p == '.reviewed-image-import/.reviewed-image-import/part-00.b64')]
          parts.sort(key=lambda p: int(p.split('part-')[-1].split('.')[0]))
          assert len(parts) == 42, len(parts)
          data = base64.b64decode(''.join(pathlib.Path(p).read_text().strip() for p in parts))
          assert hashlib.sha256(data).hexdigest() == 'b28a8c3298fd9dd8fc354a726e3939452a8d9da0cf39f250e2173cff81b11033'
          pathlib.Path('/tmp/reviewed-images.patch').write_bytes(gzip.decompress(data))
      - name: Import onto clean review branch, never main
        run: |
          set -eu
          git switch -c image-cleanup-reviewed-24nov b69a3a4cfa3a9baefb36babfc248c2c476bdf707
          git apply --index /tmp/reviewed-images.patch
          test "$(git write-tree)" = "01c2b5928abc3fb2b1bba1d755e0a3f076010f50"
          test ! -e .github/workflows/import-reviewed-images.yml
          test ! -e .reviewed-image-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace unrelated blog imagery with explicit reviewed placements'
          git push origin HEAD:refs/heads/image-cleanup-reviewed-24nov
      - name: Remove temporary import files and trigger from staging branch
        run: |
          set -eu
          git switch blog-images-reviewed-24nov
          git rm -r .reviewed-image-import
          git rm reviewed-import-part-*.b64 .github/workflows/import-reviewed-images.yml
          git commit -m 'Remove completed one-time image import and trigger'
          git push origin HEAD:refs/heads/blog-images-reviewed-24nov
