name: Local security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep CE (local rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.187.0
      - name: Check detection and safe-code fixtures
        run: semgrep --test --config .semgrep/lwa.yml .semgrep/tests/lwa.ts --metrics=off --disable-version-check
      - name: Scan application and build scripts
        run: >-
          semgrep scan --config .semgrep/lwa.yml --metrics=off
          --disable-version-check --strict --error
          --exclude '**/__tests__/**' --exclude 'scripts/tests/**' src scripts

  trivy:
    name: Trivy (both dependency lockfiles)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan production and development dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: .git,node_modules,dist
          trivy-config: /dev/null
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
          TRIVY_PKG_TYPES: library

  cloudflare-skill:
    name: Cloudflare audit resource integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify pinned audit resource
        run: node scripts/verify-security-audit-resource.mjs
