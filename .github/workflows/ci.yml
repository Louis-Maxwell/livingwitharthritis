# GitHub Actions concurrency + rate-limit hardening
#
# Drop this block near the top of `.github/workflows/ci.yml` (after `on:`,
# before `jobs:`). It fixes the #1 real-world rate-limit problem for a
# small charity repo: push, correct a typo, push again — old workflow
# still running, new one queues, minutes and API budget wasted.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# --- Rate-limit hardening ---------------------------------------------------
# 1) Auto-cancel any older CI run on the same ref when a new push arrives.
#    This is the single highest-impact fix: no more piled-up queue, no more
#    doubled Dependabot/API calls, no wasted Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 2) Least-privilege token. GitHub rate-limits are per-token; a broadly-
#    scoped token gets throttled harder in practice. `contents: read` is
#    the minimum needed for typecheck + SEO audit builds.
permissions:
  contents: read
# ---------------------------------------------------------------------------

jobs:
  verify:
    runs-on: ubuntu-latest
    # timeout-minutes prevents a hung job burning your monthly minutes budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clone — fewer API calls, faster, lower rate-limit cost.
          fetch-depth: 1

      # Aggressive dependency caching. Every cache hit avoids ~200 npm-
      # registry API calls per install — matters when Dependabot's 5-PR
      # weekly grouping runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        # --prefer-offline uses the cache before hitting the registry;
        # --no-audit skips the npm audit call (Dependabot does this better).
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: SEO schema check
        run: npm run seo:schema

      - name: SEO audit (against local build)
        run: |
          npx serve -s dist -p 4173 &
          SERVER_PID=$!
          sleep 3
          SITE_URL=http://localhost:4173 npm run seo:audit
          kill $SERVER_PID
