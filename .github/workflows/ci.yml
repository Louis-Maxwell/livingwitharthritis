# GitHub Actions concurrency + rate-limit hardening
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: AI identity check
        run: node scripts/validate-ai-identity.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: CSS utility check
        run: npm run css:check -- --json

      - name: Build (prerendered)
        run: npm run build:prerender

      - name: Prerender meta check
        run: npm run seo:prerender-meta -- --json

      - name: SEO schema check
        run: npm run seo:schema

      - name: Redirect map check
        run: npm run seo:redirects

      - name: SEO audit (against local build)
        run: |
          set -e
          npx serve -s dist -p 4173 > /tmp/lwa-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              cat /tmp/lwa-serve.log || true
              exit 1
            fi
            sleep 1
          done
          timeout 5m npm run seo:audit
        env:
          BASE_URL: http://localhost:4173

      - name: Public template performance gate
        run: node scripts/perf-lighthouse.mjs --no-build

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-preflight-reports
          path: .preflight-reports/
          retention-days: 14
          if-no-files-found: ignore
