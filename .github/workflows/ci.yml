# GitHub Actions concurrency + rate-limit hardening
#
# Drop this block near the top of `.github/workflows/ci.yml` (after `on:`,
# before `jobs:`). It fixes the #1 real-world rate-limit problem for a
# small charity repo: push, correct a typo, push again — old workflow
# still running, new one queues, minutes and API budget wasted.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# --- Rate-limit hardening ---------------------------------------------------
# 1) Auto-cancel any older CI run on the same ref when a new push arrives.
#    This is the single highest-impact fix: no more piled-up queue, no more
#    doubled Dependabot/API calls, no wasted Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 2) Least-privilege token. GitHub rate-limits are per-token; a broadly-
#    scoped token gets throttled harder in practice. `contents: read` is
#    the minimum needed for typecheck + SEO audit builds.
permissions:
  contents: read
# ---------------------------------------------------------------------------

jobs:
  # NOTE: job id matches the currently-failing "CI / build-and-audit" check
  # on GitHub so this file replaces it rather than running alongside it.
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: AI identity check
        run: node scripts/validate-ai-identity.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # Alerts on Tailwind utilities that are ambiguous (e.g. duration-[1200ms])
      # or that bypass the design tokens, before they reach a build.
      - name: CSS utility check
        run: npm run css:check -- --json

      - name: Upload CSS utility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-utility-report
          path: .preflight-reports/css-utilities-*.json
          retention-days: 7
          if-no-files-found: ignore

      # Prerendered build: this is the artefact that actually gets published,
      # so it is what the meta/indexing checks below must audit.
      - name: Build (prerendered)
        run: npm run build:prerender

      # Fails if any built page still ships the generic homepage
      # title/description, or a noindex robots tag.
      - name: Prerender meta check
        run: npm run seo:prerender-meta -- --json

      - name: Blog HTML gate
        run: npm run blog:html-gate

      - name: Upload prerender meta report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-meta-report
          path: .preflight-reports/prerender-meta-*.json
          retention-days: 7
          if-no-files-found: ignore

      # Validate JSON-LD from the prerendered dist/ HTML on disk.
      # Do NOT hit localhost here: nothing is served yet (seo:audit starts
      # serve later). DIST_DIR mode skips Puppeteer and finishes in seconds.
      - name: SEO schema check
        run: npm run seo:schema
        env:
          DIST_DIR: dist

      - name: Redirect map check
        run: npm run seo:redirects

      # ROOT CAUSE OF THE 20m HANG: the server was started with `&` and the
      # step moved on after a blind `sleep 3` with no check that it was
      # actually up, AND `npm run seo:audit` had no timeout — so a slow
      # server start or a hung network call inside the audit would run
      # until GitHub's own hang-detection eventually cancelled the job.
      #
      # Fix: poll for the server to actually respond before auditing, wrap
      # the audit in `timeout 5m` so a hang fails fast and visibly, and
      # always kill the server even if the audit step fails.
      - name: SEO audit (against local build)
        run: |
          npx serve -s dist -p 4173 &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          set +e
          timeout 5m npm run seo:audit
          AUDIT_EXIT=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $AUDIT_EXIT
        env:
          SITE_URL: http://localhost:4173
          BASE_URL: http://localhost:4173
          DIST_DIR: dist
