name: Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --max-warnings 0: warnings fail the job too.
      - name: Run ESLint
        run: npm run lint

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The suite used to run against a dev server that was never started and
      # was marked continue-on-error, so it could not fail. It now runs every
      # spec in e2e/ against the built site and fails the job on any failure.
      - name: Build
        run: npm run build

      - name: Serve build
        run: |
          npx --yes serve -s dist -l 4173 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then break; fi
            sleep 1
          done

      - name: Run E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/


  blog-smoke:
    name: Blog smoke (Playwright, must pass)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Serve build
        run: |
          npx --yes serve -s dist -l 4173 &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Preview server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Blog smoke (fail the workflow)
        run: npm run test:blog-smoke
        continue-on-error: false

      # Key routes on the built output: /, /blog, /blog/archive, /faq, plus the
      # WCAG 2.1 AA axe smoke (contrast needs a real browser) and popup stacking.
      - name: Route smoke (fail the workflow)
        run: npx playwright test e2e/route-smoke.spec.ts e2e/a11y-smoke.spec.ts

      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/serve.pid)" 2>/dev/null || true

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security patch
        run: npm run test:dependency-security

      - name: Run npm audit
        run: npm audit --audit-level=moderate

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
