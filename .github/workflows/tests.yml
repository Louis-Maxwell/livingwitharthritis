name: Tests

on:
  push:
    branches: [main, codex/enterprise-seo-audit-2026-10-11]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Vitest — full suite (unit + a11y + validation).
  vitest:
    name: Vitest (unit + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Blog posts are the source of truth. Refresh generated metadata before
      # running source-integrity tests so title edits cannot leave a stale
      # checked-in head-data snapshot behind.
      - name: Refresh generated blog metadata
        run: bun scripts/generate-blog-catalog.ts && node scripts/generate-blog-head-data.mjs
      - name: Run Vitest
        run: bunx vitest run

  # Playwright — visual regression + E2E form flow. Runs against a locally
  # built + previewed copy of the app so the run is hermetic (no dev-server
  # HMR flake, no reliance on the deployed site).
  playwright:
    name: Playwright (visual + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: Serve build
        run: |
          nohup bunx serve -s dist -l 4173 > /tmp/lwa-preview.log 2>&1 < /dev/null &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Preview server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:4173 > /dev/null || { cat /tmp/lwa-preview.log; exit 1; }
      # Includes tests/visual/layout-snapshots.spec.ts — the layout
      # regression alerts (no horizontal overflow, no element wider than the
      # viewport, plus screenshot diffs when baselines are committed).
      - name: Run Playwright tests (visual + layout alerts)
        run: bunx playwright test --config=tests/visual/playwright.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/serve.pid)" 2>/dev/null || true
