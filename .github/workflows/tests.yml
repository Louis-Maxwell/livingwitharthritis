name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Vitest — full suite (unit + a11y + validation).
  vitest:
    name: Vitest (unit + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Vitest
        run: bunx vitest run

  # Deno tests for edge functions — the chat prompt-injection regression
  # suite. Boots `supabase functions serve` in the background so tests can
  # optionally hit the served function over HTTP; the current
  # injection.test.ts imports pure logic directly, but wiring up the
  # serve step keeps CI ready for HTTP-level tests without another PR.
  deno:
    name: Deno (edge function tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start supabase functions serve
        run: |
          # --no-verify-jwt lets tests call the function without a JWT.
          # `SUPABASE_ACCESS_TOKEN` is unused for local `functions serve`.
          nohup supabase functions serve chat --no-verify-jwt > /tmp/functions-serve.log 2>&1 &
          echo $! > /tmp/functions-serve.pid
          # Poll for readiness (functions serve binds to :54321 by default).
          for i in $(seq 1 30); do
            if curl -sf http://localhost:54321/functions/v1/chat -X OPTIONS > /dev/null 2>&1; then
              echo "functions serve ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Non-fatal: log tail so a failed boot is visible in CI output.
          tail -n 40 /tmp/functions-serve.log || true
        continue-on-error: true
      - name: Chat injection regression tests
        run: deno test --allow-net --allow-env --allow-read supabase/functions/chat/injection.test.ts
      - name: Stop supabase functions serve
        if: always()
        run: kill "$(cat /tmp/functions-serve.pid)" 2>/dev/null || true

  # Playwright — visual regression + E2E form flow. Runs against a locally
  # built + previewed copy of the app so the run is hermetic (no dev-server
  # HMR flake, no reliance on the deployed site).
  playwright:
    name: Playwright (visual + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: Serve build
        run: |
          bunx serve -s dist -l 4173 &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Preview server ready after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Run Playwright tests
        run: bunx playwright test --config=tests/visual/playwright.config.ts
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/serve.pid)" 2>/dev/null || true
