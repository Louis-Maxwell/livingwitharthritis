name: Security and SEO guardrails

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/check-security-guardrails.mjs"
      - ".github/workflows/security-seo-guardrails.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/check-security-guardrails.mjs"
      - ".github/workflows/security-seo-guardrails.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-seo-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Sitemap and security integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check security and sitemap invariants
        run: node scripts/check-security-guardrails.mjs
