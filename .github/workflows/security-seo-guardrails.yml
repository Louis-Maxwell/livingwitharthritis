name: Security and SEO guardrails

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-seo-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Sitemap, security and AI integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Check security, sitemap and AI-discovery invariants
        run: node scripts/check-security-guardrails.mjs

      - name: Check verified AI identity and crawler policy
        run: node scripts/validate-ai-identity.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
