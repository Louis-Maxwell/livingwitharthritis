# Keep the npm lockfile synchronized with package.json so GitHub Dependabot
# audits the dependency tree that CI actually installs, rather than a stale tree.
# This also closes stale historical alerts caused by an old package-lock.json.
name: Regenerate npm lockfile

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - architectural-seo-performance-hardening-2026-09
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: lockfile-regen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Resolve from package.json and rewrite package-lock.json without
      # executing lifecycle scripts. This is deliberately done before audit.
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      # Apply safe, non-major npm audit remediations to the lockfile only.
      # Never use --force: major dependency changes require a reviewed PR.
      - name: Apply safe npm audit remediations
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit and push if changed
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already up to date — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile and remediate dependency alerts"
          git push
