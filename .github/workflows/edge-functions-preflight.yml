name: Edge Functions Preflight

on:
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/preflight-edge-functions.mjs"
      - ".deno-version"
      - ".github/workflows/edge-functions-preflight.yml"

jobs:
  preflight:
    name: Type-check edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Deno version
        id: deno_version
        run: echo "version=$(cat .deno-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Deno ${{ steps.deno_version.outputs.version }}
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ steps.deno_version.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run preflight type-check
        run: node scripts/preflight-edge-functions.mjs

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: .preflight-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize report in job summary
        if: always()
        run: |
          latest_log=$(ls -t .preflight-reports/*.log 2>/dev/null | head -n1 || true)
          if [ -n "$latest_log" ]; then
            {
              echo "## Edge Functions Preflight"
              echo ""
              echo '```'
              cat "$latest_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
