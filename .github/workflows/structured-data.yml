name: Structured data and crawlability checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structured-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Validate sitemap JSON-LD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Use supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build prerendered routes
        run: npm run build:prerender
      - name: Validate JSON-LD
        env:
          DIST_DIR: dist
          JSONLD_REPORT_DIR: jsonld-report
        run: npm run seo:schema
      - name: Upload JSON-LD report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jsonld-report
          path: jsonld-report
          retention-days: 7
          if-no-files-found: ignore
