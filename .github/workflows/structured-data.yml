name: Structured data and crawlability checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structured-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Validate sitemap JSON-LD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build prerendered routes
        run: bun run build:prerender
      - name: Validate JSON-LD
        env:
          DIST_DIR: dist
          JSONLD_REPORT_DIR: jsonld-report
        run: bun run seo:schema
      - name: Upload JSON-LD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jsonld-report
          path: jsonld-report
