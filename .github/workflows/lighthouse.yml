name: Lighthouse performance budget

on:
  push:
    branches: [main, codex/enterprise-seo-audit-2026-10-11]
  pull_request:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run build

      # Thresholds in lighthouserc.json (mobile) and lighthouserc.desktop.json
      # (desktop) are calibrated to the current medians with headroom, so this
      # gate fails on regressions rather than on today's baseline. Set
      # LHCI_REPORT_ONLY=true temporarily to un-block merges while recalibrating.
      - name: Lighthouse CI (mobile + desktop budgets)
        env:
          LHCI_REPORT_ONLY: 'false'

        run: |
          set +e
          node scripts/perf-lighthouse.mjs --no-build
          LH_EXIT=$?
          if [ "$LHCI_REPORT_ONLY" = "true" ]; then
            echo "Report-only mode: exit code $LH_EXIT ignored."
            exit 0
          fi
          exit $LH_EXIT

      - name: Summarize measured Lighthouse results
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          for (const dir of ['.lighthouseci-mobile', '.lighthouseci-desktop']) {
            if (!existsSync(dir)) continue;
            for (const name of readdirSync(dir).filter((name) => name.endsWith('.json'))) {
              let report;
              try { report = JSON.parse(readFileSync(dir + '/' + name, 'utf8')); } catch { continue; }
              if (!report.categories?.performance) continue;
              const result = {
                url: report.finalDisplayedUrl || report.finalUrl,
                device: report.configSettings?.formFactor,
                scores: Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, Math.round(value.score * 100)])),
                lcpMs: report.audits?.['largest-contentful-paint']?.numericValue,
                fcpMs: report.audits?.['first-contentful-paint']?.numericValue,
                tbtMs: report.audits?.['total-blocking-time']?.numericValue,
                cls: report.audits?.['cumulative-layout-shift']?.numericValue,
              };
              console.log('LIGHTHOUSE_RESULT ' + JSON.stringify(result));
            }
          }
          JS

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
            .lighthouseci-mobile/
            .lighthouseci-desktop/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
