name: Blog remediation inventory
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/content/blog/posts/**'
      - 'scripts/audit-catalog-remediation.mjs'
      - '.github/workflows/blog-remediation-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate catalogue inventory
        run: node scripts/audit-catalog-remediation.mjs
      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: blog-remediation-inventory
          path: |
            docs/audits/remediation-manifest.json
            docs/audits/remediation-manifest.csv
            docs/audits/remediation-summary.json
          retention-days: 30
