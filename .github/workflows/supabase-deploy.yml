name: Supabase Deploy

# Automatically deploys Supabase edge functions and database migrations to production.
#
# Edge Functions: Deployed on every push to main that touches supabase/functions/**
# Database Migrations: Deployed on every push to main that touches supabase/migrations/**
#
# **IMPORTANT — First-time setup:**
# Before migrations auto-deploy, the Supabase CLI's migration tracking must be
# reconciled with the live database. This is a one-time operation:
#
# 1. Run locally: ./scripts/repair-migrations.sh
#    - Authenticate with SUPABASE_ACCESS_TOKEN env var
#    - Marks all existing migrations as applied in CLI tracking
#
# 2. After repair is complete and verified:
#    - All future commits touching supabase/migrations/** will deploy automatically
#
# See docs/DATABASE-MIGRATIONS.md for full details.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref eswdtpmknwjxtvkyxvmi

      - name: Deploy all functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy

  deploy-migrations:
    name: Deploy database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref eswdtpmknwjxtvkyxvmi

      - name: Check migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list

      - name: Push pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked
