name: External link guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-link-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    name: Validate external URL sources
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Validate external URLs
        run: node scripts/check-external-links.mjs
