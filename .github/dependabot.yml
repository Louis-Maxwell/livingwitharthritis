# Automated dependency updates — keeps the 65-alert situation from ever recurring.
# Dependabot opens grouped PRs; your CI (typecheck + seo:audit + seo:schema)
# validates each one automatically before you merge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      # One tidy PR for all patch/minor security-relevant bumps
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-fixes:
        applies-to: security-updates
        update-types:
          - "major"
          - "minor"
          - "patch"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
