<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .heart { fill: #DC2626; }
      .paw { fill: #991B1B; }
      .accent { fill: #FCA5A5; }
    </style>
  </defs>

  <!-- Background Circle (optional, for favicon) -->
  <circle cx="60" cy="60" r="58" fill="white" stroke="#DC2626" stroke-width="2" />

  <!-- Heart Shape (scaled and centered) -->
  <path
    class="heart"
    d="M 60 45 
       C 60 38, 56 32, 48 32 
       C 40 32, 36 38, 36 45 
       C 36 58, 60 75, 60 75 
       C 60 75, 84 58, 84 45 
       C 84 38, 80 32, 72 32 
       C 64 32, 60 38, 60 45 Z"
  />

  <!-- Paw Print Integrated -->
  <!-- Main Pad -->
  <circle class="paw" cx="60" cy="60" r="11" opacity="0.85" />
  
  <!-- Toe Pads with subtle gradient effect -->
  <!-- Top -->
  <circle class="paw" cx="60" cy="32" r="6" opacity="0.95" />
  <!-- Top Left -->
  <circle class="paw" cx="40" cy="45" r="6" opacity="0.95" />
  <!-- Top Right -->
  <circle class="paw" cx="80" cy="45" r="6" opacity="0.95" />
  <!-- Bottom Left -->
  <circle class="paw" cx="45" cy="75" r="6" opacity="0.95" />
  <!-- Bottom Right -->
  <circle class="paw" cx="75" cy="75" r="6" opacity="0.95" />

  <!-- Connection Arcs -->
  <path
    class="accent"
    d="M 48 48 Q 45 55, 50 62"
    stroke="#FCA5A5"
    stroke-width="1.5"
    fill="none"
    stroke-linecap="round"
    opacity="0.7"
  />
  <path
    class="accent"
    d="M 72 48 Q 75 55, 70 62"
    stroke="#FCA5A5"
    stroke-width="1.5"
    fill="none"
    stroke-linecap="round"
    opacity="0.7"
  />
</svg>
