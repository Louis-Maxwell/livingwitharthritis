<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" rx="24" fill="#f6f4ef"/><g font-family="Arial,sans-serif" fill="#173d36"><text x="60" y="82" font-size="38" font-weight="bold">Make a workable wound-care plan</text><text x="60" y="127" font-size="24">Questions for your practice or wound-care team</text><rect x="60" y="170" width="1080" height="94" rx="14" fill="white"/><text x="90" y="208" font-size="27" font-weight="bold">What needs clinical assessment?</text><text x="90" y="242" font-size="23">Report changes rather than waiting for the next dressing change.</text><rect x="60" y="287" width="1080" height="94" rx="14" fill="white"/><text x="90" y="325" font-size="27" font-weight="bold">Who can help with the difficult task?</text><text x="90" y="359" font-size="23">Explain what you cannot see, reach, open or keep in place.</text><rect x="60" y="404" width="1080" height="94" rx="14" fill="white"/><text x="90" y="442" font-size="27" font-weight="bold">What happens between appointments?</text><text x="90" y="476" font-size="23">Agree supplies, dressing changes and a contact for concerns.</text><text x="60" y="740" font-size="18">Living With Arthritis | Conversation aid, not a treatment or first-aid plan</text></g></svg>
