<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description"><title id="title">Everyday pressure care</title><desc id="description">Change position regularly, check your skin every day and get equipment assessed. Ask your nurse or care team for an individual plan.</desc><rect width="1200" height="800" fill="#f5f3ef"/><g font-family="Arial, sans-serif" fill="#203c36"><text x="70" y="110" font-size="49" font-weight="700">Everyday pressure care</text><text x="70" y="165" font-size="28">A personal plan with your nurse or care team</text><g fill="white"><rect x="65" y="235" width="1070" height="135" rx="20"/><rect x="65" y="395" width="1070" height="135" rx="20"/><rect x="65" y="555" width="1070" height="135" rx="20"/></g><g fill="#366859"><circle cx="123" cy="292" r="33"/><circle cx="123" cy="452" r="33"/><circle cx="123" cy="612" r="33"/></g><g font-size="30" font-weight="700" fill="white" text-anchor="middle"><text x="123" y="302">1</text><text x="123" y="462">2</text><text x="123" y="622">3</text></g><g font-size="34" font-weight="700"><text x="185" y="285">Change position regularly</text><text x="185" y="445">Check your skin every day</text><text x="185" y="605">Get equipment assessed</text></g><g font-size="27" fill="#45504c"><text x="185" y="335">Ask for help if moving is difficult.</text><text x="185" y="495">Tell your care team about new changes.</text><text x="185" y="655">A cushion does not replace moving.</text></g><text x="70" y="765" font-size="20" fill="#45504c">Illustration: Living With Arthritis | General information, not an individual care plan</text></g></svg>
