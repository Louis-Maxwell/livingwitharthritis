# Netlify: Vite SPA + crawlable 301s (not client-only React redirects).
# Publish directory is `dist` from `bun run build` / `npm run build`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PRERENDER = "0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Blog slug consolidations — keep in sync with src/data/blogRedirects.ts
