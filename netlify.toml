# Netlify publish config for Living With Arthritis UK.
# Connecting this GitHub repo in Netlify is the hosting step that gives
# real HTTP 301s and 404s. Lovable's current catch-all still returns 200.
[build]
  command = "npm run build:prerender"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PRERENDER = "1"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true
