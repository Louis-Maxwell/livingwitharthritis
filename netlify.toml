# Hosting layer for Living With Arthritis UK.
# Static prerendered files are served first. Legacy blog URLs get real HTTP 301s.
# Unknown paths get HTTP 404 via public/404.html — not a homepage 200 fallback.
# App-only screens that are not prerendered (sign-in, admin, checkout) still
# rewrite to the SPA shell so Google sign-in and private tools keep working.

[build]
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PUPPETEER_CACHE_DIR = "/opt/buildhome/.cache/puppeteer"

